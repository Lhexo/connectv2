# Configurazione Virtual Host Nginx per Danea Easyfatt & Connect (Node.js/Express porta 3000)
# File: /etc/nginx/sites-available/default (o /etc/nginx/sites-available/connect.conf)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # Sostituisci '_' con il tuo dominio reale o hostname (es. connect.tuodominio.it)
    server_name _; 

    client_max_body_size 50M;

    # 1. Inoltro globale per la SPA React e le rotte REST API
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header HTTP_X_AUTHORIZATION $http_x_authorization;

        # Prevenzione timeout per sync voluminosi
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # 2. Intercezione esplicita degli endpoint legacy PHP per eliminare definitivamente l'errore 405 Method Not Allowed
    location ~ \.php$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header HTTP_X_AUTHORIZATION $http_x_authorization;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
